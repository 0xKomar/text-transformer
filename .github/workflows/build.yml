name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracja JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Budowanie i testy
        run: mvn -B package

      - name: Zapisanie paczki
        uses: actions/upload-artifact@v4
        with:
          name: text-transformer
          path: target/*.jar

      # Wysyłka działa po dodaniu sekretów MAIL_SERVER, MAIL_PORT, MAIL_USERNAME,
      # MAIL_PASSWORD i MAIL_TO w Settings -> Secrets and variables -> Actions.
      - name: Powiadomienie o nieudanym buildzie
        if: failure() && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Text Transformer CI
          subject: "Nieudany build: ${{ github.repository }} (${{ github.ref_name }})"
          body: |
            Build zakończył się błędem.
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Szczegóły: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
